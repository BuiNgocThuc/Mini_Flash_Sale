spring:
  application:
    name: identity-service

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
    database-platform: org.hibernate.dialect.OracleDialect

server:
  port: 8081

jwt:
  expiration: 86400000 # 1 ngày (ms)